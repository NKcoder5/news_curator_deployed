# Serves the Create React App build. Loaded as conf.d/default.conf, so it sits
# inside nginx's http block.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Text compresses to a quarter of its size; images and fonts are already compressed.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # For the container health check; touches no file and writes no log line.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Files under /static carry a content hash in their name (main.742bb7a3.js),
    # so a given URL never changes meaning and can be kept for a year. A missing
    # one is a real 404: falling back to index.html here would hand the browser
    # HTML where it asked for a script, and the failure would read as a syntax
    # error in the console rather than as a missing file.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Everything else is the app. index.html is the one file whose name never
    # changes and whose contents point at the current hashed bundle, so it must
    # be revalidated every time or a visitor keeps running the previous release.
    # Any path that is not a file is a client-side route (/check, /article, ...)
    # and gets index.html, so a refresh or a shared link opens the right page.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
