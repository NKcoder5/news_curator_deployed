<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1018" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Pure Press checks news and forwarded messages against independent outlets, fact-checkers and reference facts, and shows the evidence behind every verdict."
    />
    <link rel="icon" href="%PUBLIC_URL%/logo.png" />
    <title>Pure Press — evidence-based fact checking</title>

    <!-- A theme the reader chose is applied before the first paint, so the
         page never flashes light before turning dark. Storage can throw
         (private windows, blocked site data); then the system setting rules. -->
    <script>
      try {
        var t = window.localStorage.getItem('pp-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need JavaScript enabled to run Pure Press.</noscript>
    <div id="root"></div>
  </body>
</html>
